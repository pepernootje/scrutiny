site_name: Scrutiny
site_description: Supervisory check playground for prospectus document analysis
site_author: Scrutiny Team
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true

nav:
  - Home: index.md
  - About: about.md
  - API Reference: reference/

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
