[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrutiny"
version = "0.1.0"
description = "Streamlit playground for designing and evaluating supervisory checks on prospectus documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.32.0",
    "pdfplumber>=0.11.0",
    "PyYAML>=6.0.1",
    "azure-search-documents>=11.4.0",
    "azure-identity>=1.16.0",
    "openai>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.7.0",
    "pylint>=3.1.0",
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "yamllint>=1.35.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint."messages control"]
disable = ["C0114", "R0903"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --import-mode=importlib"
pythonpath = ["src"]
